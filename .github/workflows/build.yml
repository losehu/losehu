name: Build and Push Executable

on:
  push:
    branches:
      - 2048
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build 2048
        run: |
          g++ -std=c++11 main.cpp -o 2048

      - name: Commit executable when changed
        run: |
          if git diff --quiet -- 2048; then
            echo "Executable is already up to date."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add 2048
          git commit -m "Build latest 2048 executable"
          git push origin HEAD:2048
